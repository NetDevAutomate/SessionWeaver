repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: debug-statements
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ".*\\.lock$"

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest --cov=session_weaver --cov-fail-under=90
        language: system
        types: [python]
        pass_filenames: false

      - id: check-commit-author
        name: Check commit author is NetDevAutomate
        entry: >-
          bash -c '
          if [ "${CHECK_COMMIT_SHA+x}" = x ]; then
          if ! commit="$(git rev-parse --verify --quiet "${CHECK_COMMIT_SHA}^{commit}")"; then
          echo "ERROR: CHECK_COMMIT_SHA must identify a commit";
          exit 1; fi;
          if [ "${ALLOW_GITHUB_MERGE_COMMIT:-}" = "true" ]; then
          parent_count=$(($(git show -s --format=%P "$commit" | wc -w)));
          if [ "$parent_count" -ne 2 ]; then
          echo "ERROR: merge mode requires a two-parent merge commit; found $parent_count parent(s)";
          exit 1; fi;
          merge_committer="$(git show -s --format="%cn <%ce>" "$commit")";
          if [ "$merge_committer" != "GitHub <noreply@github.com>" ]; then
          echo "ERROR: merge committer must be GitHub <noreply@github.com>";
          echo "  committer: $merge_committer";
          exit 1; fi;
          if ! second="$(git rev-parse --verify --quiet "${commit}^2")"; then
          echo "ERROR: cannot resolve the merge second parent";
          exit 1; fi;
          second_author="$(git show -s --format="%an <%ae>" "$second")";
          second_committer="$(git show -s --format="%cn <%ce>" "$second")";
          if [ "$second_author" != "NetDevAutomate <andy.taylor@mail.com>" ] ||
          [ "$second_committer" != "NetDevAutomate <andy.taylor@mail.com>" ]; then
          echo "ERROR: merged PR head must be authored by NetDevAutomate <andy.taylor@mail.com>";
          echo "  author:    $second_author";
          echo "  committer: $second_committer";
          exit 1; fi;
          if ! git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null; then
          echo "ERROR: merge mode requires fetched origin/main for ancestry proof";
          exit 1; fi;
          if ! git rev-list --first-parent refs/remotes/origin/main | grep -qx "$commit"; then
          echo "ERROR: merge commit is not on origin/main first-parent history";
          exit 1; fi;
          exit 0; fi;
          author="$(git show -s --format=%an "$commit")";
          email="$(git show -s --format=%ae "$commit")";
          cname="$(git show -s --format=%cn "$commit")";
          cemail="$(git show -s --format=%ce "$commit")";
          fix="Fix the checked-out commit metadata before running CI";
          else
          author="${GIT_AUTHOR_NAME:-$(git config user.name)}";
          email="${GIT_AUTHOR_EMAIL:-$(git config user.email)}";
          cname="${GIT_COMMITTER_NAME:-$(git config user.name)}";
          cemail="${GIT_COMMITTER_EMAIL:-$(git config user.email)}";
          fix="Fix: git config user.name NetDevAutomate && git config user.email andy.taylor@mail.com";
          fi;
          if [ "$author" != "NetDevAutomate" ] || [ "$email" != "andy.taylor@mail.com" ] ||
          [ "$cname" != "NetDevAutomate" ] || [ "$cemail" != "andy.taylor@mail.com" ]; then
          echo "ERROR: Commits must be authored by NetDevAutomate <andy.taylor@mail.com>";
          echo "  author:    $author <$email>";
          echo "  committer: $cname <$cemail>";
          echo "$fix";
          exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
